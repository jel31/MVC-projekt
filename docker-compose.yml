services:
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge
    container_name: dogwalking-sqlserver
    environment:
      MSSQL_SA_PASSWORD: 'Str0ng!DogWalk2026#'
      ACCEPT_EULA: 'Y'
      MSSQL_PID: 'Developer'
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: [
        "CMD-SHELL",
        "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Str0ng!DogWalk2026#' -Q 'SELECT 1' || exit 1"
      ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sqlserver_data:
